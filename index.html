<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0A3D6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>แบบสอบถามความพึงพอใจ – Home Phototherapy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A3D6B;--navy2:#1A5FA0;--navy3:#2E82CC;
  --sky:#E8F4FD;--sky2:#C8E4F8;
  --gold:#F5A623;--teal:#00897B;--teal2:#E0F2F1;
  --gray50:#F8FAFC;--gray100:#F1F5F9;--gray200:#E2E8F0;
  --gray400:#94A3B8;--gray600:#475569;--gray800:#1E293B;
  --red:#DC2626;--green:#16A34A;
  --c1:#EF4444;--c2:#F97316;--c3:#EAB308;--c4:#22C55E;--c5:#0EA5E9;
  --r:16px;--rs:10px;--font:'Sarabun',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--gray50);color:var(--gray800);min-height:100vh;font-size:16px;line-height:1.6}

/* header */
.hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 4px 16px rgba(10,61,107,.15)}
.hdr-in{max-width:680px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:12px}
.hdr-logo{width:38px;height:38px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hdr-t{flex:1;min-width:0}
.hdr-t1{font-size:14px;font-weight:700;line-height:1.2}
.hdr-t2{font-size:11px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-btn{background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:8px 10px;color:#fff;cursor:pointer;font-size:18px}
.prog-bg{background:rgba(255,255,255,.2);height:4px}
.prog-fill{background:var(--gold);height:4px;transition:width .4s;border-radius:0 2px 2px 0}

/* main */
.main{max-width:680px;margin:0 auto;padding:16px 14px 100px}

/* step dots */
.dots{display:flex;align-items:center;gap:5px;margin-bottom:18px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:2px solid var(--gray200);background:#fff;color:var(--gray400);transition:all .3s}
.dot.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(10,61,107,.15)}
.dot.done{background:var(--teal);border-color:var(--teal);color:#fff}
.dline{flex:1;height:2px;background:var(--gray200);min-width:10px;transition:background .3s}
.dline.done{background:var(--teal)}

/* card */
.card{background:#fff;border-radius:var(--r);box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid var(--gray200);overflow:hidden;margin-bottom:14px;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card-hd{background:var(--sky);border-bottom:1px solid var(--sky2);padding:13px 16px;display:flex;align-items:center;gap:10px}
.card-ico{width:32px;height:32px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.card-ht{font-size:14px;font-weight:700;color:var(--navy)}
.card-hs{font-size:11px;color:var(--gray600);margin-top:1px}
.card-bd{padding:14px 16px}

/* welcome */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2),var(--navy3));border-radius:var(--r);color:#fff;padding:26px 20px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:rgba(255,255,255,.06);border-radius:50%}
.hero-ico{font-size:44px;margin-bottom:10px}
.hero-t{font-size:21px;font-weight:700;margin-bottom:5px}
.hero-s{font-size:13px;opacity:.85;line-height:1.5}
.hero-badge{display:inline-flex;align-items:center;gap:5px;background:var(--gold);color:var(--navy);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-top:10px}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.icard{background:#fff;border:1px solid var(--gray200);border-radius:var(--rs);padding:13px;text-align:center}
.icard-n{font-size:24px;font-weight:700;color:var(--navy)}
.icard-l{font-size:11px;color:var(--gray600);margin-top:3px}
.priv{background:var(--teal2);border:1px solid #B2DFDB;border-radius:var(--rs);padding:11px 14px;font-size:12px;color:#004D40;display:flex;gap:9px;margin-bottom:18px}
.legend-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.leg-item .leg-c{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;margin:0 auto 3px}
.leg-item .leg-n{font-size:12px;font-weight:700;color:var(--gray600)}
.leg-item .leg-l{font-size:10px;color:var(--gray400)}

/* fields */
.fg{margin-bottom:14px}
.fl{font-size:13px;font-weight:600;color:var(--gray800);margin-bottom:7px;display:block}
.fl .req{color:var(--red);margin-left:3px}
.finp{width:100%;padding:11px 13px;border:1.5px solid var(--gray200);border-radius:var(--rs);font-family:var(--font);font-size:15px;color:var(--gray800);background:#fff;outline:none;transition:border-color .2s;-webkit-appearance:none}
.finp:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(46,130,204,.1)}
.rgrp{display:flex;gap:7px;flex-wrap:wrap}
.rbtn{flex:1;min-width:72px;padding:10px 7px;border:1.5px solid var(--gray200);border-radius:var(--rs);text-align:center;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;background:#fff;color:var(--gray600);user-select:none}
.rbtn:hover{border-color:var(--navy3);background:var(--sky)}
.rbtn.sel{border-color:var(--navy);background:var(--sky);color:var(--navy);font-weight:700}

/* likert */
.qblock{border-bottom:1px solid var(--gray100);padding:15px 0}
.qblock:last-child{border-bottom:none;padding-bottom:0}
.qtxt{font-size:14px;font-weight:500;color:var(--gray800);margin-bottom:11px;line-height:1.5}
.qnum{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;background:var(--navy);color:#fff;border-radius:50%;font-size:10px;font-weight:700;margin-right:5px;flex-shrink:0;vertical-align:middle}
.lrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lbtn{aspect-ratio:1;border-radius:50%;border:2px solid var(--gray200);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .2s;user-select:none;min-height:50px}
.lbtn:hover{transform:scale(1.05)}
.lbtn .ln{font-size:15px;font-weight:800}
.lbtn .le{font-size:9px;line-height:1.1;text-align:center}
.lbtn.s1{border-color:var(--c1)}.lbtn.s1.on{background:var(--c1);border-color:var(--c1);color:#fff;transform:scale(1.1);box-shadow:0 4px 12px rgba(239,68,68,.35)}
.lbtn.s2{border-color:var(--c2)}.lbtn.s2.on{background:var(--c2);border-color:var(--c2);color:#fff;transform:scale(1.1);box-shadow:0 4px 12px rgba(249,115,22,.35)}
.lbtn.s3{border-color:var(--c3)}.lbtn.s3.on{background:var(--c3);border-color:var(--c3);color:var(--gray800);transform:scale(1.1);box-shadow:0 4px 12px rgba(234,179,8,.35)}
.lbtn.s4{border-color:var(--c4)}.lbtn.s4.on{background:var(--c4);border-color:var(--c4);color:#fff;transform:scale(1.1);box-shadow:0 4px 12px rgba(34,197,94,.35)}
.lbtn.s5{border-color:var(--c5)}.lbtn.s5.on{background:var(--c5);border-color:var(--c5);color:#fff;transform:scale(1.1);box-shadow:0 4px 12px rgba(14,165,233,.35)}
.llabels{display:flex;justify-content:space-between;font-size:10px;color:var(--gray400);margin-top:3px;padding:0 2px}
.unanswered .lbtn{border-color:#FCA5A5;animation:pulse 1s ease 2}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* NPS */
.nrow{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:8px}
.nbtn{aspect-ratio:1;border-radius:7px;border:2px solid var(--gray200);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gray400);transition:all .2s;user-select:none}
.nbtn:hover{border-color:var(--navy3);background:var(--sky)}
.nbtn.nlo.on{background:var(--c1);border-color:var(--c1);color:#fff}
.nbtn.nmi.on{background:var(--c3);border-color:var(--c3);color:var(--gray800)}
.nbtn.nhi.on{background:var(--c5);border-color:var(--c5);color:#fff}
.nlabels{display:flex;justify-content:space-between;font-size:11px;color:var(--gray400);margin-top:5px}

/* nav bar */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--gray200);padding:11px 14px;z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.07)}
.nav-in{max-width:680px;margin:0 auto;display:flex;gap:9px}
.btn{flex:1;padding:13px 18px;border-radius:var(--rs);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy2)}
.btn-p:active{transform:scale(.98)}
.btn-s{background:var(--gray100);color:var(--gray600);flex:.55}.btn-s:hover{background:var(--gray200)}
.btn-sub{background:linear-gradient(135deg,var(--teal),#00695C);color:#fff}
.btn-sub:hover{box-shadow:0 4px 16px rgba(0,137,123,.4)}
.btn-sub:disabled{opacity:.5;cursor:not-allowed}

/* error */
.errbanner{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:var(--rs);padding:11px 14px;font-size:13px;color:var(--red);margin-bottom:11px;display:flex;gap:7px}

/* settings modal */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.msheet{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 34px;width:100%;max-width:680px;max-height:80vh;overflow-y:auto;animation:sheetup .3s ease}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:38px;height:4px;background:var(--gray200);border-radius:2px;margin:0 auto 18px}
.mtitle{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:14px}
.info-banner{background:#FAEEDA;border:1px solid #F5A623;border-radius:var(--rs);padding:11px 14px;font-size:12px;color:#7C4A00;margin-bottom:12px;display:flex;gap:8px}
.gas-code{background:var(--gray50);border:1px solid var(--gray200);border-radius:var(--rs);padding:10px 12px;font-family:monospace;font-size:11px;color:var(--gray600);margin-top:8px;line-height:1.6;overflow-x:auto;white-space:pre}

/* success */
.success{text-align:center;padding:36px 16px;animation:up .4s ease}
.sico{font-size:68px;margin-bottom:14px}
.stitle{font-size:22px;font-weight:700;color:var(--teal);margin-bottom:7px}
.ssub{font-size:14px;color:var(--gray600);line-height:1.6}
.sref{margin-top:18px;background:var(--gray100);border-radius:var(--rs);padding:11px 14px;font-size:12px;color:var(--gray600)}
.scontact{background:var(--sky);border-radius:var(--rs);padding:13px 14px;margin-top:14px;text-align:left}
.btn-restart{margin-top:22px;background:var(--navy);color:#fff;padding:13px 28px;border-radius:var(--rs);border:none;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;width:100%}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* toast */
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--gray800);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-logo">🌟</div>
    <div class="hdr-t">
      <div class="hdr-t1">แบบสอบถามความพึงพอใจ</div>
      <div class="hdr-t2">Home Phototherapy · โรงพยาบาลรามาธิบดีจักรีนฤบดินทร์</div>
    </div>
    <button class="cfg-btn" onclick="openCfg()" title="ตั้งค่า">⚙️</button>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="prog" style="width:0%"></div></div>
</header>

<main class="main" id="app"></main>

<div class="nav" id="nav"><div class="nav-in" id="navIn"></div></div>

<!-- Settings Modal -->
<div class="moverlay" id="modal" style="display:none" onclick="if(event.target===this)closeCfg()">
  <div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">⚙️ ตั้งค่า Google Sheets</div>
    <div class="fg">
      <label class="fl">Google Apps Script URL <span class="req">*</span></label>
      <input class="finp" type="url" id="urlInp" placeholder="https://script.google.com/macros/s/.../exec">
      <div style="font-size:11px;color:var(--gray400);margin-top:5px">วาง URL จาก Apps Script → Deploy → Web app</div>
    </div>
    <div class="info-banner">
      <span>💡</span>
      <div>ทดสอบ URL โดยเปิดใน browser ก่อน — ต้องเห็น <strong>HomePT Survey Script — OK ✓</strong></div>
    </div>
    <button class="btn btn-p" onclick="saveCfg()" style="width:100%">บันทึก URL</button>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const EM = ['😞','😐','😊','😄','🌟'];
const LB = ['ไม่พอใจ','ควรปรับปรุง','พอใช้','ดี','ดีมาก'];

const SECS = [
  { id:'welcome', type:'welcome' },
  { id:'info',    type:'info' },
  {
    id:'s1', icon:'🏥', title:'กระบวนการเข้าร่วมโปรแกรม',
    qs:['ได้รับข้อมูลเกี่ยวกับโปรแกรมสองไฟที่บ้านอย่างชัดเจน เข้าใจง่าย',
        'แพทย์อธิบายข้อดี ความเสี่ยง และทางเลือกอื่นอย่างครบถ้วนก่อนลงนามยินยอม',
        'กระบวนการเตรียมเอกสารและชำระค่าประกันอุปกรณ์สะดวก ไม่ซับซ้อน',
        'รู้สึกมีส่วนร่วมในการตัดสินใจเลือกการรักษาที่บ้าน'], qStart:1
  },
  {
    id:'s2', icon:'💡', title:'การให้ความรู้และสาธิตก่อนกลับบ้าน',
    qs:['พยาบาลสอนวิธีใช้เครื่องสองไฟ (B\'bloo/Bilisoft) อย่างชัดเจน สาธิตเข้าใจง่าย',
        'แผ่นพับมีเนื้อหาครบถ้วน ภาษาอ่านง่าย ภาพประกอบชัดเจน',
        'วิดีโอสาธิตผ่าน QR Code ช่วยให้เข้าใจการใช้อุปกรณ์ได้ดียิ่งขึ้น',
        'หลังรับการสอน รู้สึกมั่นใจในการดูแลบุตรขณะสองไฟที่บ้านด้วยตนเอง',
        'พยาบาลให้เวลาฝึกปฏิบัติและตอบคำถามอย่างเพียงพอ'], qStart:5
  },
  {
    id:'s3', icon:'📱', title:'การติดตามผลผ่าน Video Call',
    qs:['พยาบาลโทรติดตามผ่าน Video Call ตรงเวลาตามที่นัดหมาย',
        'พยาบาลประเมินอาการบุตรและให้คำแนะนำได้ชัดเจนระหว่าง Video Call',
        'การใช้งาน Line application เพื่อติดต่อทีมพยาบาลทำได้ง่ายและสะดวก',
        'เมื่อติดต่อสอบถามนอกเวลานัด ได้รับการตอบกลับอย่างรวดเร็ว (<30 นาที)',
        'รู้สึกปลอดภัยและไม่วิตกกังวล เพราะมีทีมพยาบาลติดตามดูแลอย่างต่อเนื่อง'], qStart:10
  },
  {
    id:'s4', icon:'🏠', title:'การเยี่ยมบ้านโดยพยาบาล',
    qs:['พยาบาลเยี่ยมบ้านมาตรงเวลา แจ้งล่วงหน้าอย่างเหมาะสม',
        'พยาบาลตรวจร่างกายบุตรและอธิบายผลการตรวจเลือดให้เข้าใจ',
        'พยาบาลตอบคำถามและให้คำแนะนำด้วยความเต็มใจ เป็นมิตร ไม่เร่งรีบ',
        'พยาบาลเจาะเลือดบุตรอย่างระมัดระวัง ช่วยลดความเจ็บปวดของบุตร'], qStart:15
  },
  {
    id:'s5', icon:'⭐', title:'ผลการรักษาและความพึงพอใจโดยรวม',
    qs:['พึงพอใจกับผลการรักษา (ระดับตัวเหลืองลดลงตามที่คาดหวัง)',
        'การสองไฟที่บ้านสะดวกกว่าการนอนโรงพยาบาล',
        'รู้สึกว่าสายสัมพันธ์กับบุตรดีขึ้น (Mother-infant bonding)',
        'รู้สึกว่าสามารถดูแลบุตรได้ด้วยตนเองมากขึ้น (Parental empowerment)',
        'จะแนะนำโปรแกรมสองไฟที่บ้านให้ผู้ที่อยู่ในสถานการณ์เดียวกัน',
        'ความพึงพอใจโดยรวมต่อโปรแกรม Home Phototherapy'], qStart:19
  },
  { id:'nps', type:'nps', icon:'💬', title:'คะแนนและข้อเสนอแนะ' }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let step = 0;
const ans = {};

// ─── UTILS ────────────────────────────────────────────────────────────────────
const gasUrl = () => localStorage.getItem('gasUrl') || '';
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function errBanner(msg) {
  $('errB')?.remove();
  const d = document.createElement('div');
  d.id = 'errB'; d.className = 'errbanner';
  d.innerHTML = `<span>⚠️</span><span>${msg}</span>`;
  $('app').prepend(d);
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(() => d?.remove(), 4000);
}

// ─── DOTS ─────────────────────────────────────────────────────────────────────
function buildDots() {
  const wrap = document.createElement('div');
  wrap.className = 'dots'; wrap.id = 'dots';
  SECS.forEach((s,i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.id = 'dt'+i; d.textContent = i+1;
    wrap.appendChild(d);
    if (i < SECS.length-1) {
      const l = document.createElement('div');
      l.className = 'dline'; l.id = 'dl'+i;
      wrap.appendChild(l);
    }
  });
  $('app').before(wrap);
}

function refreshDots() {
  const pct = Math.round(step/(SECS.length-1)*100);
  $('prog').style.width = pct+'%';
  SECS.forEach((_,i) => {
    const d = $('dt'+i), l = $('dl'+i);
    d.className = 'dot' + (i<step?' done':i===step?' active':'');
    d.textContent = i<step ? '✓' : i+1;
    if (l) l.className = 'dline'+(i<step?' done':'');
  });
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  refreshDots();
  const sec = SECS[step];
  const app = $('app');
  app.innerHTML = '';

  if (sec.type === 'welcome') renderWelcome(app);
  else if (sec.type === 'info') renderInfo(app);
  else if (sec.type === 'nps')  renderNPS(app);
  else renderLikert(app, sec);

  renderNav();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderNav() {
  if (step === 0) return;
  const last = step === SECS.length-1;
  $('navIn').innerHTML =
    (step > 1 ? `<button class="btn btn-s" onclick="back()">← ย้อนกลับ</button>` : '') +
    (last
      ? `<button class="btn btn-sub" id="subBtn" onclick="doSubmit()"><span>ส่งแบบสอบถาม</span><span>✓</span></button>`
      : `<button class="btn btn-p" onclick="next()">ถัดไป →</button>`);
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────
function pickL(n, v, row) {
  ans['q'+n] = v;
  row.querySelectorAll('.lbtn').forEach((b,i) => b.classList.toggle('on', i+1===v));
  $('qb'+n)?.classList.remove('unanswered');
}
function pickN(v) {
  ans.nps = v;
  document.querySelectorAll('.nbtn').forEach((b,i) => b.classList.toggle('on', i===v));
}
function pickR(field, v, el) {
  ans[field] = v;
  el.parentNode.querySelectorAll('.rbtn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
}

function next() {
  if (!validate()) return;
  step++; render();
}
function back() { step--; render(); }

function validate() {
  if (step === 0) return true;
  const sec = SECS[step];

  if (sec.type === 'info') {
    if (!ans.relation)  return errBanner('กรุณาเลือกความสัมพันธ์กับทารก'), false;
    const age = $('f_age')?.value;
    if (!age || isNaN(age) || +age < 1) return errBanner('กรุณากรอกอายุทารก'), false;
    ans.babyAge = age;
    if (!ans.ptDays) return errBanner('กรุณาเลือกจำนวนวันที่สองไฟ'), false;
    return true;
  }

  if (sec.qs) {
    let ok = true;
    sec.qs.forEach((_,qi) => {
      const n = sec.qStart+qi;
      if (!ans['q'+n]) { $('qb'+n)?.classList.add('unanswered'); ok = false; }
    });
    if (!ok) { errBanner('กรุณาตอบทุกข้อก่อนไปหน้าถัดไป'); return false; }
    return true;
  }

  if (sec.type === 'nps') {
    if (ans.nps === undefined || ans.nps < 0) return errBanner('กรุณาเลือกคะแนน NPS (0–10)'), false;
    ans.goodComment    = $('f_good')?.value || '';
    ans.improveComment = $('f_imp')?.value  || '';
    return true;
  }
  return true;
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
async function doSubmit() {
  if (!validate()) return;
  const btn = $('subBtn');
  if (btn) { btn.disabled=true; btn.innerHTML='<div class="spin"></div><span>กำลังส่ง...</span>'; }

  const qs = Array.from({length:24},(_,i)=>'q'+(i+1));
  const vals = qs.map(k=>ans[k]).filter(v=>v&&!isNaN(v));
  const avg = vals.length ? (vals.reduce((a,b)=>+a+ +b,0)/vals.length).toFixed(2) : '0';
  const ref = 'HPT-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6);
  const now = new Date();
  const date = now.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});

  const payload = {
    refNo:ref, date,
    relation:ans.relation||'', babyAge:ans.babyAge||'', ptDays:ans.ptDays||'',
    ...Object.fromEntries(qs.map(k=>[k,ans[k]||''])),
    nps:ans.nps??'', goodComment:ans.goodComment||'',
    improveComment:ans.improveComment||'', avgScore:avg
  };

  const url = gasUrl();
  if (!url) { saveLocal(payload); showSuccess(ref,avg,true); return; }

  try {
    await postForm(url, payload);
    saveLocal(payload);
    showSuccess(ref, avg, false);
  } catch(e) {
    saveLocal(payload);
    showSuccess(ref, avg, true);
  }
}

function postForm(url, data) {
  return new Promise(resolve => {
    const iname = 'if_'+Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = iname; iframe.style.display='none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method='POST'; form.action=url; form.target=iname; form.style.display='none';
    Object.entries(data).forEach(([k,v])=>{
      const inp=document.createElement('input');
      inp.type='hidden'; inp.name=k; inp.value=v??'';
      form.appendChild(inp);
    });
    document.body.appendChild(form);
    iframe.onload = () => { setTimeout(()=>{form.remove();iframe.remove();},800); resolve(); };
    setTimeout(()=>resolve(), 5000);
    form.submit();
  });
}

function saveLocal(p) {
  try { localStorage.setItem('hpt_'+Date.now(), JSON.stringify(p)); } catch(e){}
}

function showSuccess(ref, avg, offline) {
  $('nav').style.display='none';
  $('dots').style.display='none';
  $('app').innerHTML = `
    <div class="success">
      <div class="sico">🌟</div>
      <div class="stitle">ขอบคุณอย่างยิ่ง!</div>
      <div class="ssub">
        ${offline?'<span style="color:var(--gold);font-weight:600">⚠️ บันทึกไว้ในเครื่อง (offline)</span><br><br>':''}
        ทีมพยาบาลโปรแกรม Home Phototherapy<br>
        ขอบคุณที่สละเวลาตอบแบบสอบถาม<br>
        คำตอบของท่านมีคุณค่าต่อการพัฒนาบริการ
      </div>
      <div class="sref">
        <div style="font-size:11px;color:var(--gray400);margin-bottom:3px">หมายเลขอ้างอิง</div>
        <div style="font-size:17px;font-weight:700;color:var(--navy);letter-spacing:1px">${ref}</div>
        <div style="font-size:12px;color:var(--gray600);margin-top:5px">
          คะแนนเฉลี่ยของท่าน: <strong style="color:var(--teal)">${avg} / 5.00</strong>
        </div>
      </div>
      <div class="scontact">
        <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px">📞 ติดต่อโปรแกรม Home Phototherapy</div>
        <div style="font-size:13px;color:var(--gray600)">
          โทร. <strong>02-839-6870</strong> ตลอด 24 ชั่วโมง<br>
          Line: @CNPHOTO
        </div>
      </div>
      <button class="btn-restart" onclick="restart()">ทำแบบสอบถามใหม่</button>
    </div>`;
}

function restart() {
  step=0;
  Object.keys(ans).forEach(k=>delete ans[k]);
  $('nav').style.display='';
  $('dots').style.display='';
  render();
}

// ─── CONFIG ───────────────────────────────────────────────────────────────────
function openCfg() { $('urlInp').value=gasUrl(); $('modal').style.display='flex'; }
function closeCfg() { $('modal').style.display='none'; }
function saveCfg() {
  const v=$('urlInp').value.trim();
  if(v) { localStorage.setItem('gasUrl',v); toast('บันทึก URL แล้ว ✓'); }
  else  { localStorage.removeItem('gasUrl'); toast('ล้าง URL แล้ว (offline mode)'); }
  closeCfg(); render();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{ buildDots(); render(); });
</script>
